name: Vercel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-node22-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_bzLvAoF9QpNXWLRU8obt6Ryv
  VERCEL_PROJECT_ID: prj_RpLryXfftMow1T5ESY5qFy2VhIDD
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        run: |
          test -n "$VERCEL_TOKEN" || (echo "::error::Missing VERCEL_TOKEN secret" && exit 1)

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel production settings
        run: |
          set -euo pipefail
          pnpm exec vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Deploy source to Vercel production
        id: deploy
        env:
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: bridge-win
          VERCEL_GIT_REPO_SLUG: eatfear
          VERCEL_GIT_REPO_ID: "1122338274"
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: ${{ github.actor }}
        run: |
          set -uo pipefail
          set +e
          pnpm exec vercel deploy \
            --prod \
            --force \
            --yes \
            --token="$VERCEL_TOKEN" \
            --meta githubCommitOrg=bridge-win \
            --meta githubCommitRepo=eatfear \
            --meta githubCommitRepoId=1122338274 \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitAuthorLogin="$GITHUB_ACTOR" \
            2>&1 | tee vercel-deploy.log
          deploy_status="${PIPESTATUS[0]}"
          set -e
          if [ "$deploy_status" -ne 0 ]; then
            echo "::error::Vercel source deploy failed with exit code $deploy_status"
            tail -n 40 vercel-deploy.log | sed "s/${VERCEL_TOKEN}/[redacted]/g" | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$deploy_status"
          fi
          deployment_url="$(
            node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync("vercel-deploy.log", "utf8");
              const matches = raw.match(/https:\/\/[a-zA-Z0-9.-]+\.vercel\.app\b/g) ?? [];
              const url = matches.at(-1) ?? "";
              if (!url) {
                console.error("::error::Vercel deployment URL not found in deploy output");
                process.exit(1);
              }
              console.log(url);
            '
          )"
          test -n "$deployment_url" || (echo "::error::Vercel deployment URL not found" && exit 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url"

      - name: Verify Vercel production deployment
        run: |
          set -euo pipefail
          pnpm exec vercel inspect \
            "${{ steps.deploy.outputs.deployment_url }}" \
            --wait \
            --timeout=5m \
            --format=json \
            --token="$VERCEL_TOKEN" \
            > vercel-inspect.json
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("vercel-inspect.json", "utf8"));
            const readyState = data.readyState ?? data.state;
            const target = data.target ?? data.meta?.target;
            const projectId = data.projectId ?? data.project?.id ?? data.meta?.projectId;
            if (readyState !== "READY") {
              console.error(`::error::Vercel deployment is not READY: ${readyState ?? "unknown"}`);
              process.exit(1);
            }
            if (target && target !== "production") {
              console.error(`::error::Vercel deployment target is not production: ${target}`);
              process.exit(1);
            }
            if (projectId && projectId !== process.env.VERCEL_PROJECT_ID) {
              console.error(`::error::Vercel deployment used unexpected project: ${projectId}`);
              process.exit(1);
            }
            console.log(`Verified Vercel deployment ${data.url ?? data.name ?? "unknown"} is READY.`);
          '
