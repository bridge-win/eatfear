name: Vercel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-node22-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_bzLvAoF9QpNXWLRU8obt6Ryv
  VERCEL_PROJECT_ID: prj_RpLryXfftMow1T5ESY5qFy2VhIDD
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        run: |
          test -n "$VERCEL_TOKEN" || (echo "::error::Missing VERCEL_TOKEN secret" && exit 1)

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Vercel production settings
        run: |
          set -euo pipefail
          pnpm exec vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      - name: Deploy source to Vercel production
        id: deploy
        env:
          VERCEL_GIT_PROVIDER: github
          VERCEL_GIT_REPO_OWNER: bridge-win
          VERCEL_GIT_REPO_SLUG: eatfear
          VERCEL_GIT_REPO_ID: "1122338274"
          VERCEL_GIT_COMMIT_REF: ${{ github.ref_name }}
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
          VERCEL_GIT_COMMIT_AUTHOR_LOGIN: ${{ github.actor }}
        run: |
          set -uo pipefail
          set +e
          # No --force: it skips the build cache on every run, which burns the
          # Hobby build-minute budget and was the likeliest trigger for Vercel's
          # "Resource provisioning failed".
          pnpm exec vercel deploy \
            --prod \
            --yes \
            --logs \
            --token="$VERCEL_TOKEN" \
            --meta githubCommitOrg=bridge-win \
            --meta githubCommitRepo=eatfear \
            --meta githubCommitRepoId=1122338274 \
            --meta githubCommitRef="$GITHUB_REF_NAME" \
            --meta githubCommitSha="$GITHUB_SHA" \
            --meta githubCommitAuthorLogin="$GITHUB_ACTOR" \
            2>&1 | tee vercel-deploy.log
          deploy_status="${PIPESTATUS[0]}"
          set -e
          if [ "$deploy_status" -ne 0 ]; then
            echo "::error::Vercel source deploy failed with exit code $deploy_status"
            # GitHub caps the number of annotations per step, so collapse the whole
            # tail into one multi-line annotation (%0A) instead of one per line.
            tail -n 200 vercel-deploy.log \
              | sed "s/${VERCEL_TOKEN}/[redacted]/g" \
              | python3 -c 'import sys; print("::error title=vercel-cli-log::" + sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))'
            # `vercel deploy --logs` stops streaming as soon as the build fails, so
            # re-read the build log for that deployment to get the actual error.
            failed_url="$(grep -o 'https://[a-zA-Z0-9.-]*\.vercel\.app' vercel-deploy.log | tail -n 1 || true)"
            if [ -n "$failed_url" ]; then
              # `vercel inspect --logs` only reports status, so read the build
              # events straight from the REST API.
              curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v13/deployments/${failed_url#https://}?teamId=$VERCEL_ORG_ID" \
                > vercel-dep.json 2>&1 || true
              head -c 3000 vercel-dep.json \
                | sed "s/${VERCEL_TOKEN}/[redacted]/g" \
                | python3 -c 'import sys; print("::error title=vercel-dep-json::" + sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))'
              dep_id="$(node -e 'const j=JSON.parse(require("node:fs").readFileSync("vercel-dep.json","utf8"));console.log(j.id??"")' 2>/dev/null || true)"
              if [ -n "$dep_id" ]; then
                curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
                  "https://api.vercel.com/v3/deployments/$dep_id/events?builds=1&limit=400&teamId=$VERCEL_ORG_ID" \
                  | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{let j;try{j=JSON.parse(d)}catch{console.log(d.slice(0,4000));return}const rows=Array.isArray(j)?j:(j.events??[]);for(const e of rows){const t=e?.payload?.text??e?.text;if(t)process.stdout.write(String(t).replace(/\n$/,"")+"\n")}})' \
                  > vercel-build.log 2>&1 || true
              fi
              pnpm exec vercel inspect "$failed_url" --logs --token="$VERCEL_TOKEN" >> vercel-build.log 2>&1 || true
              tail -n 200 vercel-build.log \
                | sed "s/${VERCEL_TOKEN}/[redacted]/g" \
                | python3 -c 'import sys; print("::error title=vercel-build-log::" + sys.stdin.read().replace("%","%25").replace("\r","").replace("\n","%0A"))'
            fi
            exit "$deploy_status"
          fi
          deployment_url="$(
            node -e '
              const fs = require("node:fs");
              const raw = fs.readFileSync("vercel-deploy.log", "utf8");
              const matches = raw.match(/https:\/\/[a-zA-Z0-9.-]+\.vercel\.app\b/g) ?? [];
              const url = matches.at(-1) ?? "";
              if (!url) {
                console.error("::error::Vercel deployment URL not found in deploy output");
                process.exit(1);
              }
              console.log(url);
            '
          )"
          test -n "$deployment_url" || (echo "::error::Vercel deployment URL not found" && exit 1)
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url"

      - name: Verify Vercel production deployment
        run: |
          set -euo pipefail
          pnpm exec vercel inspect \
            "${{ steps.deploy.outputs.deployment_url }}" \
            --wait \
            --timeout=5m \
            --format=json \
            --token="$VERCEL_TOKEN" \
            > vercel-inspect.json
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("vercel-inspect.json", "utf8"));
            const readyState = data.readyState ?? data.state;
            const target = data.target ?? data.meta?.target;
            const projectId = data.projectId ?? data.project?.id ?? data.meta?.projectId;
            if (readyState !== "READY") {
              console.error(`::error::Vercel deployment is not READY: ${readyState ?? "unknown"}`);
              process.exit(1);
            }
            if (target && target !== "production") {
              console.error(`::error::Vercel deployment target is not production: ${target}`);
              process.exit(1);
            }
            if (projectId && projectId !== process.env.VERCEL_PROJECT_ID) {
              console.error(`::error::Vercel deployment used unexpected project: ${projectId}`);
              process.exit(1);
            }
            console.log(`Verified Vercel deployment ${data.url ?? data.name ?? "unknown"} is READY.`);
          '
